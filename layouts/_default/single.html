{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  <div class="meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    {{ with .Params.categories }} · 카테고리: {{ delimit . ", " }}{{ end }}
  </div>
  <div style="margin-bottom: 1.5rem;">
    {{ range .Params.tags }}
    <span class="tag">#{{ . }}</span>
    {{ end }}
  </div>
  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
