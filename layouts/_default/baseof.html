<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "ko-kr" }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #6366f1;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
    }
    .container { max-width: 780px; margin: 0 auto; padding: 2rem 1.25rem; }
    header { border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; }
    header a { color: var(--text); text-decoration: none; font-weight: 700; font-size: 1.2rem; }
    .post-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; }
    .post-card h2 { margin: 0 0 0.5rem 0; font-size: 1.25rem; }
    .post-card a { color: var(--text); text-decoration: none; }
    .post-card a:hover { color: var(--accent); }
    .meta { color: var(--muted); font-size: 0.875rem; margin-bottom: 0.75rem; }
    .tag { display: inline-block; background: #312e81; color: #c7d2fe; padding: 0.15rem 0.55rem; border-radius: 999px; font-size: 0.75rem; margin-right: 0.35rem; }
    pre { background: #020617; padding: 1rem; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.9em; }
    blockquote { border-left: 4px solid var(--accent); margin: 1rem 0; padding: 0.25rem 1rem; color: var(--muted); background: rgba(99, 102, 241, 0.08); }
    footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a>
      <span class="meta">{{ .Site.Params.description }}</span>
    <!-- books-navigation -->
<nav aria-label="블로그 메뉴"><a href="{{ "books/" | relURL }}">Books</a></nav>
</header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    <footer>
      Powered by Hugo &amp; AI Story-to-Blog Publisher
    </footer>
  </div>
</body>
</html>
